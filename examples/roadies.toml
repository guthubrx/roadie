# Roadie example configuration / Exemple de configuration Roadie.
#
# Copy to ~/.config/roadies/roadies.toml, then check it with: roadie config validate
# Copier vers ~/.config/roadies/roadies.toml, puis vérifier avec : roadie config validate
#
# Every value below is the default unless a comment says otherwise.
# Chaque valeur ci-dessous est la valeur par défaut, sauf indication contraire.

# EN: Tiling engine. default_strategy: spatialBsp | bsp | masterStack | tabbed | scrolling | float.
#     spatialBsp = yabai-like persistent tree (aliases: mutableBsp, yabai).
# FR: Moteur de tiling. default_strategy : spatialBsp | bsp | masterStack | tabbed | scrolling | float.
#     spatialBsp = arbre persistant façon yabai (alias : mutableBsp, yabai).
[tiling]
default_strategy = "spatialBsp"
# EN: Drag the gaps in persistent tree layouts; native window-edge resizing remains available.
# FR: Tirer les séparations de l'arbre persistant ; les bords natifs restent utilisables.
resize_handles = true
# FR: Réorganiser les voisines pendant le glisser. EN: Move neighbors during drag.
live_drag_preview = true
gaps_outer = 8
gaps_inner = 4
master_ratio = 0.6
# EN: Tabbed mode bar height (20..44 pt) and scrolling ribbon column ratio (0.25..1.0).
# FR: Hauteur de la barre d'onglets (20..44 pt) et largeur de colonne du ruban défilant (0.25..1.0).
tabbed_bar_height = 28
scrolling_column_width = 0.65
# EN: 120 Hz ProMotion spring glide and native trackpad gestures for scrolling mode.
# FR: Glissement fluide 120 Hz ProMotion et gestes trackpad natifs pour le mode scrolling.
scrolling_smooth_scroll = true
scrolling_trackpad_gestures = true
scrolling_trackpad_fingers = 3
# EN: Enable named floating scratchpads (roadie scratchpad) and their reboot policy:
#     reattach_or_relaunch (default) | reattach | ephemeral.
# FR: Activer les scratchpads flottants nommés (roadie scratchpad) et leur politique au reboot :
#     reattach_or_relaunch (défaut) | reattach | ephemeral.
scratchpad_enabled = true
scratchpad_reboot_policy = "reattach_or_relaunch"
# EN: Remove the gaps when a stage holds a single window.
# FR: Supprime les marges quand une stage ne contient qu'une fenêtre.
smart_gaps_solo = false

# EN: Per-display outer gaps. Match a display by name or id (see: roadie display list).
# FR: Marges extérieures par écran. Cible un écran par nom ou id (voir : roadie display list).
# [[tiling.display_overrides]]
# display_name = "LG HDR 4K"
# gaps_outer_left = 150

# EN: Stage that is active on an empty desktop, and optional named stages.
# FR: Stage active sur un desktop vide, et stages nommées facultatives.
[stage_manager]
default_stage = "1"

[[stage_manager.workspaces]]
id = "dev"
display_name = "Dev"

[[stage_manager.workspaces]]
id = "web"
display_name = "Web"

# EN: Applications that Roadie never tiles (bundle identifiers).
# FR: Applications que Roadie ne tile jamais (identifiants de bundle).
[exclusions]
floating_bundles = ["com.apple.systempreferences"]

# EN: Focus behavior. Focus follows mouse is off by default.
# FR: Comportement du focus. Le focus suit la souris : désactivé par défaut.
[focus]
stage_follows_focus = true
assign_follows_focus = false
stage_move_follows_focus = true
focus_follows_mouse = false
mouse_follows_focus = false

# EN: Where new application windows go: mouse | focused_display | macos.
# FR: Où vont les nouvelles fenêtres : mouse | focused_display | macos.
# EN: Default: the active display's current stage, even when the pointer is elsewhere.
# FR: Défaut : stage courant de l'écran actif, même si la souris est ailleurs.
[window_placement]
new_apps_target = "focused_display"
new_window_side = "right"

# EN: Window switcher. Edit profiles in Réglages Roadie > Sélecteur (up to nine).
# FR: Sélecteur de fenêtres. Profils dans Réglages Roadie > Sélecteur (neuf au maximum).
[switcher]
# classic, stage_columns, desktop_tabs, hierarchy, sections, overview.
# EN: Choose the organization independently from the card style; profiles can override it.
# FR: Organisation indépendante du style des cartes, surchargeable par profil.
presentation = "classic"
enabled = true
style = "thumbnails"
auto_size = true
thumbnail_width = 220
font_size = 16
font_family = "system"
preview = true
# EN: Direct single-key actions in the switcher (W/Q/M/H/S/A/D outside search).
# FR: Touches d'action directe dans le sélecteur (W/Q/M/H/S/A/D hors recherche).
action_keys_enabled = true
excluded_bundles = []

[[switcher.shortcuts]]
id = "all"
name = "Toutes les fenêtres"
hotkey = "" # Natif Roadie : hotkey = "command+tab" + trigger_source = "roadie" ; ou externe : roadie switcher cycle --hold cmd
scope = "all"
release_action = "focus"
sort_order = "recent"
include_minimized = true
include_hidden = true
include_fullscreen = true
one_per_app = false

# EN: Global overview (Archipelago/Bays). Native 4-finger swipe up/down without BTT.
# FR: Vue d'ensemble globale (Archipel/Baies). Geste natif 4 doigts haut/bas sans BTT.
[overview]
trackpad_gesture = true

# EN: Width presets used by: roadie layout width next|prev.
# FR: Largeurs prédéfinies utilisées par : roadie layout width next|prev.
[width_adjustment]
presets = [0.5, 0.67, 0.8, 1.0]
nudge_step = 0.05

# EN: Colored border around the focused window. Off by default.
# FR: Bordure colorée autour de la fenêtre active. Désactivée par défaut.
[fx.borders]
enabled = false
thickness = 2
corner_radius = 10
active_color = "#7AA2F7"
inactive_color = "#414868"

# EN: Stage rail. Needs the Screen Recording permission for live thumbnails.
# FR: Rail de stages. Demande la permission Enregistrement de l'écran pour les vignettes.
[fx.rail]
renderer = "stacked-previews"
width = 150
# EN: Hide the rail on a native fullscreen window. Set hide_on_maximized = true
#     to hide it in front of a maximized window too.
# FR: Masque le rail devant une fenêtre en plein écran natif. Mettre
#     hide_on_maximized = true pour le masquer aussi devant une fenêtre agrandie.
hide_on_maximized = false
auto_hide = false
layout_mode = "overlay"
# EN: A click on empty rail space does nothing, so a miss-click cannot hide the stage.
# FR: Un clic dans le vide du rail ne fait rien : un clic raté ne masque pas la stage.
empty_click_hide_active = false

[fx.rail.layout]
header_position = "top"
stages_position = "center"

[fx.rail.stage_labels]
enabled = true

# EN: Soft click-through dimming veil over unfocused tiled windows in the active stage. Off by default.
# FR: Voile doux traversant aux clics sur les fenêtres inactives de la stage active. Désactivé par défaut.
[fx.dim_inactive]
enabled = false
opacity = 0.22

# EN: Target mode (letters and search). label_font_size: label text size in points, 8 to 48.
# FR: Mode cible (lettres et recherche). label_font_size : taille du texte des étiquettes en points, de 8 à 48.
[launcher]
label_font_size = 13
calc_conversions = true
emoji_picker = true
timer_enabled = true

# EN: Local clipboard history (0o600 permissions; sensitive types and password managers excluded).
# FR: Historique presse-papiers local (droits 0o600 ; types sensibles et gestionnaires de mots de passe exclus).
[clipboard]
enabled = true
max_items = 200
retention_days = 7

# EN: Local snippets (search with "snip" in launcher; optional global auto-expansion off by default).
# FR: Snippets locaux (recherche « snip » dans le lanceur ; auto-expansion globale désactivée par défaut).
[snippets]
enabled = true
auto_expand = false

# EN: Recursive grid. label_font_size: label text size in points, 8 to 48.
# FR: Grille récursive. label_font_size : taille du texte des étiquettes en points, de 8 à 48.
[experimental.target_grid]
label_font_size = 13

# EN: Window rules. Check them with: roadie rules validate
# FR: Règles de fenêtres. Vérifier avec : roadie rules validate
[[rules]]
id = "firefox-pip"
priority = 100
match = { app = "Firefox", title_regex = "Picture-in-Picture" }
action = { exclude = true }

[[rules]]
id = "terminal-on-dev"
priority = 50
match = { app = "Terminal" }
action = { assign_stage = "dev", follow = false }
